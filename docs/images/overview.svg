<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Figma Local CLI 工作流程</title>
  <desc id="desc">本地 Agent 通过本机桥接和 Figma 插件操作原生设计，并导出版本化交接包。</desc>
  <rect width="1400" height="560" fill="#f7f8fa"/>
  <rect x="28" y="28" width="1344" height="504" rx="8" fill="#ffffff" stroke="#dfe3e8"/>

  <text x="72" y="92" fill="#111827" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="700">Figma Local CLI</text>
  <text x="72" y="128" fill="#5f6875" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Local Agent → 原生 Figma 设计 → 可追溯的前端交接</text>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="72" y="180" width="272" height="238" rx="8" fill="#f4f8ff" stroke="#9ec5ff"/>
    <circle cx="108" cy="218" r="18" fill="#1769e0"/>
    <text x="108" y="225" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">1</text>
    <text x="140" y="226" fill="#111827" font-size="23" font-weight="700">Local Agent</text>
    <text x="100" y="270" fill="#5f6875" font-size="16">启动服务并复制连接码</text>
    <rect x="100" y="296" width="216" height="82" rx="6" fill="#101827"/>
    <text x="116" y="325" fill="#9ed0ff" font-family="SFMono-Regular, Consolas, monospace" font-size="14">$ figma-local-cli serve</text>
    <text x="116" y="350" fill="#d8e1eb" font-family="SFMono-Regular, Consolas, monospace" font-size="14">$ ... pair --copy</text>
    <text x="116" y="375" fill="#d8e1eb" font-family="SFMono-Regular, Consolas, monospace" font-size="14">$ ... sessions · bind</text>

    <rect x="392" y="180" width="272" height="238" rx="8" fill="#f6fbf8" stroke="#9cd5ba"/>
    <circle cx="428" cy="218" r="18" fill="#15805e"/>
    <text x="428" y="225" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">2</text>
    <text x="460" y="226" fill="#111827" font-size="23" font-weight="700">Local Bridge</text>
    <text x="420" y="270" fill="#5f6875" font-size="16">仅监听本机回环地址</text>
    <text x="420" y="309" fill="#111827" font-family="SFMono-Regular, Consolas, monospace" font-size="15">127.0.0.1:3055</text>
    <line x1="420" y1="331" x2="636" y2="331" stroke="#d6e7de"/>
    <text x="420" y="360" fill="#5f6875" font-size="15">短期凭据 · Page 绑定</text>
    <text x="420" y="388" fill="#5f6875" font-size="15">任务状态 · 不自动重放</text>

    <rect x="712" y="180" width="272" height="238" rx="8" fill="#fff9ee" stroke="#e7c67b"/>
    <circle cx="748" cy="218" r="18" fill="#b86b00"/>
    <text x="748" y="225" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">3</text>
    <text x="780" y="226" fill="#111827" font-size="23" font-weight="700">Figma Plugin</text>
    <text x="740" y="270" fill="#5f6875" font-size="16">调用公开 Plugin API</text>
    <rect x="740" y="296" width="92" height="34" rx="6" fill="#ffffff" stroke="#d6b35d"/>
    <rect x="844" y="296" width="112" height="34" rx="6" fill="#ffffff" stroke="#d6b35d"/>
    <rect x="740" y="342" width="112" height="34" rx="6" fill="#ffffff" stroke="#d6b35d"/>
    <rect x="864" y="342" width="92" height="34" rx="6" fill="#ffffff" stroke="#d6b35d"/>
    <text x="786" y="318" fill="#55431e" font-size="13" text-anchor="middle">Frame</text>
    <text x="900" y="318" fill="#55431e" font-size="13" text-anchor="middle">Component</text>
    <text x="796" y="364" fill="#55431e" font-size="13" text-anchor="middle">Variable</text>
    <text x="910" y="364" fill="#55431e" font-size="13" text-anchor="middle">Prototype</text>

    <rect x="1032" y="180" width="296" height="238" rx="8" fill="#f8f6ff" stroke="#b9a8ed"/>
    <circle cx="1068" cy="218" r="18" fill="#6952ba"/>
    <text x="1068" y="225" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">4</text>
    <text x="1100" y="226" fill="#111827" font-size="23" font-weight="700">Handoff</text>
    <text x="1060" y="270" fill="#5f6875" font-size="16">输出新的版本目录</text>
    <text x="1060" y="309" fill="#352a63" font-family="SFMono-Regular, Consolas, monospace" font-size="15">snapshot.json</text>
    <text x="1060" y="338" fill="#352a63" font-family="SFMono-Regular, Consolas, monospace" font-size="15">tokens.css</text>
    <text x="1060" y="367" fill="#352a63" font-family="SFMono-Regular, Consolas, monospace" font-size="15">previews/ · HANDOFF.md</text>
    <text x="1060" y="397" fill="#5f6875" font-size="14">供前端 Agent 实现与验收</text>

    <path d="M352 299h26" stroke="#8e98a6" stroke-width="3" stroke-linecap="round"/>
    <path d="m374 292 8 7-8 7" fill="none" stroke="#8e98a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M672 299h26" stroke="#8e98a6" stroke-width="3" stroke-linecap="round"/>
    <path d="m694 292 8 7-8 7" fill="none" stroke="#8e98a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M992 299h26" stroke="#8e98a6" stroke-width="3" stroke-linecap="round"/>
    <path d="m1014 292 8 7-8 7" fill="none" stroke="#8e98a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="72" y="458" width="1256" height="42" rx="6" fill="#f1f3f5"/>
    <circle cx="96" cy="479" r="5" fill="#15805e"/>
    <text x="112" y="485" fill="#4f5864" font-size="15">所有设计操作发生在本机；写入前核对文件与 Page，失败或结果未知时先查询任务并检查画布。</text>
  </g>
</svg>
